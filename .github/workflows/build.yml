name: Build MR Shop World APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Ensure Android project exists
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android folder missing - creating Flutter project structure"
            cp pubspec.yaml pubspec_backup.yaml
            cp lib/main.dart main_backup.dart 2>/dev/null || true
            flutter create . --project-name mr_shop_world --org com.mrshopworld.app --platforms=android
            mv -f pubspec_backup.yaml pubspec.yaml
            if [ -f main_backup.dart ]; then mv -f main_backup.dart lib/main.dart; fi
          fi

      - name: Add INTERNET permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-Shop-World-App
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
