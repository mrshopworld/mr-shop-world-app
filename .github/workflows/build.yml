name: Build MR Shop World APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Initialize Flutter Project Files
        run: |
          flutter create . --project-name mr_shop_world --org com.mrshopworld.app
      - name: Get Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-Shop-World-App
          path: build/app/outputs/flutter-apk/app-release.apk
          
