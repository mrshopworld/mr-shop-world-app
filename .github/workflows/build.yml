name: Build MR Shop World APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Create Clean Project & Fix Kotlin
        run: |
          mkdir temp_app
          cd temp_app
          flutter create . --project-name mr_shop_world --org com.mrshopworld.app
          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.7.10"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.8.22"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-Shop-World-App
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          
