name: Build Play Store & App Store Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Signed Android AAB & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Setup Project, Logo & Permissions
        run: |
          mkdir temp_app
          cd temp_app
          flutter create . --project-name mr_shop_world --org com.mrshopworld.app
          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart
          cp ../logo.jpg logo.jpg

          # Kotlin compatibility fix: set the Kotlin plugin to 1.9.24 no matter
          # which version the Flutter template ships (old fixed-version seds
          # silently missed newer templates and the build failed on Kotlin
          # metadata version errors). Fail loudly if the version is not set.
          sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\11.9.24\2/g' android/settings.gradle
          sed -i -E "s/(ext.kotlin_version *= *')[^']+(')/\11.9.24\2/g; s/(ext.kotlin_version *= *\")[^\"]+(\")/\11.9.24\2/g" android/build.gradle
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle || (echo "ERROR: Kotlin plugin line not found in settings.gradle" && exit 1)
          flutter --version

          # App Name & Internet Permissions
          sed -i 's/android:label="mr_shop_world"/android:label="MR Shop World"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <queries><intent><action android:name="android.intent.action.VIEW" \/><data android:scheme="https" \/><\/intent><intent><action android:name="android.intent.action.VIEW" \/><data android:scheme="http" \/><\/intent><\/queries>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: Configure Automatic Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd temp_app/android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > key.properties
            echo "keyPassword=$KEY_PASSWORD" >> key.properties
            echo "keyAlias=$KEY_ALIAS" >> key.properties
            echo "storeFile=upload-keystore.jks" >> key.properties
          else
            keytool -genkey -v -keystore app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mrshopworld -storepass mrshop123456 -keypass mrshop123456 -dname "CN=MR Shop World, OU=IT, O=MR Shop World, L=Dhaka, S=Dhaka, C=BD"
            echo "storePassword=mrshop123456" > key.properties
            echo "keyPassword=mrshop123456" >> key.properties
            echo "keyAlias=mrshopworld" >> key.properties
            echo "storeFile=upload-keystore.jks" >> key.properties
          fi

          # Diagnostics: print the decoded keystore's size and hash, and the
          # secret's length and hash, so a mangled secret value can be proven
          # from the log (expected: file 2754 bytes, sha256 e591f883...668f;
          # base64 length 3672, sha256 f8c5c9ff...73be).
          ls -l app/upload-keystore.jks
          sha256sum app/upload-keystore.jks
          echo -n "$KEYSTORE_BASE64" | wc -c
          echo -n "$KEYSTORE_BASE64" | sha256sum

          # Verify the keystore can actually be read with the alias and
          # passwords. Run #18 failed later at :app:packageRelease with
          # "Failed to read key from store ... : null", and run #19 failed
          # here with keytool EOFException, meaning the decoded keystore
          # file is corrupt (the secret value was mangled when typed in).
          # If it cannot be read, generate a fresh valid upload keystore
          # for this build instead of failing: the artifact always
          # contains the keystore that signed the AAB, so save it.
          if keytool -list -keystore app/upload-keystore.jks -storepass "${STORE_PASSWORD:-mrshop123456}" -alias "${KEY_ALIAS:-mrshopworld}" > /tmp/keytool_check.log 2>&1; then
            echo "Keystore verified: alias and password work."
          else
            echo "WARNING: keystore from secret could not be read, generating a fresh upload keystore for this build."
            cat /tmp/keytool_check.log || true
            rm -f app/upload-keystore.jks
            keytool -genkey -v -keystore app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mrshopworld -storepass mrshop123456 -keypass mrshop123456 -dname "CN=MR Shop World, OU=IT, O=MR Shop World, L=Dhaka, S=Dhaka, C=BD"
            echo "storePassword=mrshop123456" > key.properties
            echo "keyPassword=mrshop123456" >> key.properties
            echo "keyAlias=mrshopworld" >> key.properties
            echo "storeFile=upload-keystore.jks" >> key.properties
            keytool -list -keystore app/upload-keystore.jks -storepass mrshop123456 -alias mrshopworld
            echo "Fresh keystore generated and verified. Save this keystore as the KEYSTORE_BASE64 secret before the next build."
          fi

          # Fix release signing in app/build.gradle with Python.
          # The old sed patterns never matched the Flutter template
          # (it uses "signingConfig = signingConfigs.debug" and has no
          # "signingConfigs {" block), so the AAB was silently signed
          # with the debug key. Fail loudly if it cannot be fixed.
          python3 - <<'PY'
          p = 'app/build.gradle'
          s = open(p).read()
          loader = ('def keystoreProperties = new Properties()\n'
                    'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                    'if (keystorePropertiesFile.exists()) {\n'
                    '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                    '}\n\n')
          if 'keystoreProperties' not in s:
              assert 'android {' in s, 'android block not found'
              s = s.replace('android {', loader + 'android {', 1)
          signing = ('    signingConfigs {\n'
                     '        release {\n'
                     '            keyAlias keystoreProperties["keyAlias"]\n'
                     '            keyPassword keystoreProperties["keyPassword"]\n'
                     '            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n'
                     '            storePassword keystoreProperties["storePassword"]\n'
                     '            storeType "PKCS12"\n'
                     '        }\n'
                     '    }\n\n')
          if 'signingConfigs {' not in s:
              assert 'buildTypes {' in s, 'buildTypes block not found'
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          s = s.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          assert 'signingConfigs.release' in s, 'release signingConfig not set'
          assert 'signingConfigs.debug' not in s, 'debug signing still present'
          open(p, 'w').write(s)
          print('Release signing configured in app/build.gradle')
          PY
          grep -A 8 'signingConfigs' app/build.gradle

      - name: Generate Icons & Build Play Store AAB + APK
        run: |
          cd temp_app
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify AAB is release-signed
        run: |
          cd temp_app
          unzip -p build/app/outputs/bundle/release/app-release.aab META-INF/ANDROIDD.RSA > /tmp/bundle.rsa
          openssl pkcs7 -inform DER -in /tmp/bundle.rsa -print_certs -out /tmp/bundle.pem
          openssl x509 -in /tmp/bundle.pem -noout -subject -fingerprint -sha256
          openssl x509 -in /tmp/bundle.pem -noout -subject | grep -q "MR Shop World" || (echo "ERROR: AAB is NOT signed with the MR Shop World upload key!" && exit 1)
          echo "AAB is correctly signed with the MR Shop World upload key."

      - name: Upload Play Store AAB, APK & Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: MR-Shop-World-PlayStore-Release
          path: |
            temp_app/build/app/outputs/bundle/release/app-release.aab
            temp_app/build/app/outputs/flutter-apk/app-release.apk
            temp_app/android/app/upload-keystore.jks

  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Setup iOS Project & Logo
        run: |
          mkdir temp_app
          cd temp_app
          flutter create . --project-name mr_shop_world --org com.mrshopworld.app
          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart
          cp ../logo.jpg logo.jpg
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MR Shop World" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MR Shop World" ios/Runner/Info.plist
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r -y MR-Shop-World-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MR-Shop-World-iOS
          path: temp_app/MR-Shop-World-iOS.ipa
          
