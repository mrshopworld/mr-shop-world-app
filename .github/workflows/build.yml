name: Build Play Store & App Store Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Signed Android AAB & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'

      - name: Setup Project, Logo & Permissions
        run: |
          mkdir temp_app
          cd temp_app
          flutter create . --project-name mr_shop_world --org com.mrshopworld.app
          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart
          cp ../logo.jpg logo.jpg

          # Kotlin: use the version the Flutter 3.35 template ships (it is
          # tested with its AGP). The old pin to 1.9.24 was for the Flutter
          # 3.24 template; forcing it on a newer template risks breaking
          # the build. Just check the plugin line exists.
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle.kts 2>/dev/null || grep -n "org.jetbrains.kotlin.android" android/settings.gradle 2>/dev/null || (echo "ERROR: Kotlin plugin line not found in settings.gradle(.kts)" && exit 1)
          flutter --version

          # App Name & Internet Permissions
          sed -i 's/android:label="mr_shop_world"/android:label="MR Shop World"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <queries><intent><action android:name="android.intent.action.VIEW" \/><data android:scheme="https" \/><\/intent><intent><action android:name="android.intent.action.VIEW" \/><data android:scheme="http" \/><\/intent><\/queries>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: Configure Automatic Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd temp_app/android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > key.properties
            echo "keyPassword=$KEY_PASSWORD" >> key.properties
            echo "keyAlias=$KEY_ALIAS" >> key.properties
            echo "storeFile=upload-keystore.jks" >> key.properties
          else
            keytool -genkey -v -keystore app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mrshopworld -storepass mrshop123456 -keypass mrshop123456 -dname "CN=MR Shop World, OU=IT, O=MR Shop World, L=Dhaka, S=Dhaka, C=BD"
            echo "storePassword=mrshop123456" > key.properties
            echo "keyPassword=mrshop123456" >> key.properties
            echo "keyAlias=mrshopworld" >> key.properties
            echo "storeFile=upload-keystore.jks" >> key.properties
          fi

          # Diagnostics: print the decoded keystore's size and hash, and the
          # secret's length and hash, so a mangled secret value can be proven
          # from the log (expected: file 2754 bytes, sha256 e591f883...668f;
          # base64 length 3672, sha256 f8c5c9ff...73be).
          ls -l app/upload-keystore.jks
          sha256sum app/upload-keystore.jks
          echo -n "$KEYSTORE_BASE64" | wc -c
          echo -n "$KEYSTORE_BASE64" | sha256sum

          # Verify the keystore can actually be read with the alias and
          # passwords. Run #18 failed later at :app:packageRelease with
          # "Failed to read key from store ... : null", and run #19 failed
          # here with keytool EOFException, meaning the decoded keystore
          # file is corrupt (the secret value was mangled when typed in).
          # If it cannot be read, generate a fresh valid upload keystore
          # for this build instead of failing: the artifact always
          # contains the keystore that signed the AAB, so save it.
          if keytool -list -keystore app/upload-keystore.jks -storepass "${STORE_PASSWORD:-mrshop123456}" -alias "${KEY_ALIAS:-mrshopworld}" > /tmp/keytool_check.log 2>&1; then
            echo "Keystore verified: alias and password work."
          else
            echo "WARNING: keystore from secret could not be read, generating a fresh upload keystore for this build."
            cat /tmp/keytool_check.log || true
            rm -f app/upload-keystore.jks
            keytool -genkey -v -keystore app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mrshopworld -storepass mrshop123456 -keypass mrshop123456 -dname "CN=MR Shop World, OU=IT, O=MR Shop World, L=Dhaka, S=Dhaka, C=BD"
            echo "storePassword=mrshop123456" > key.properties
            echo "keyPassword=mrshop123456" >> key.properties
            echo "keyAlias=mrshopworld" >> key.properties
            echo "storeFile=upload-keystore.jks" >> key.properties
            keytool -list -keystore app/upload-keystore.jks -storepass mrshop123456 -alias mrshopworld
            echo "Fresh keystore generated and verified. Save this keystore as the KEYSTORE_BASE64 secret before the next build."
          fi

          # Fix release signing in app/build.gradle(.kts) with Python.
          # The old sed patterns never matched the Flutter template
          # (it uses "signingConfig = signingConfigs.debug" and has no
          # "signingConfigs {" block), so the AAB was silently signed
          # with the debug key. Fail loudly if it cannot be fixed.
          # Flutter 3.32+ templates use Kotlin DSL (app/build.gradle.kts);
          # older templates use Groovy (app/build.gradle). The loader and
          # signing block differ between the two, so detect the file first.
          python3 - <<'PY'
          import os
          if os.path.exists('app/build.gradle.kts'):
              p = 'app/build.gradle.kts'
              kts = True
          else:
              p = 'app/build.gradle'
              kts = False
          s = open(p).read()
          if kts:
              # NOTE (run #28): fully-qualified java.util.Properties() and
              # java.io.FileInputStream() do NOT compile in a .gradle.kts
              # script — Gradle Kotlin DSL resolves `java` to the Java
              # plugin extension, so `java.util` / `java.io` are unresolved.
              # Use imports at the top of the file and plain class names.
              if 'import java.util.Properties' not in s:
                  s = 'import java.io.FileInputStream\nimport java.util.Properties\n\n' + s
              loader = ('val keystoreProperties = Properties()\n'
                        'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                        'if (keystorePropertiesFile.exists()) {\n'
                        '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                        '}\n\n')
              signing = ('    signingConfigs {\n'
                         '        create("release") {\n'
                         '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                         '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                         '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                         '            storePassword = keystoreProperties["storePassword"] as String\n'
                         '            storeType = "PKCS12"\n'
                         '        }\n'
                         '    }\n\n')
              old_debug = 'signingConfig = signingConfigs.getByName("debug")'
              new_release = 'signingConfig = signingConfigs.getByName("release")'
          else:
              loader = ('def keystoreProperties = new Properties()\n'
                        'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                        'if (keystorePropertiesFile.exists()) {\n'
                        '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                        '}\n\n')
              signing = ('    signingConfigs {\n'
                         '        release {\n'
                         '            keyAlias keystoreProperties["keyAlias"]\n'
                         '            keyPassword keystoreProperties["keyPassword"]\n'
                         '            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n'
                         '            storePassword keystoreProperties["storePassword"]\n'
                         '            storeType "PKCS12"\n'
                         '        }\n'
                         '    }\n\n')
              old_debug = 'signingConfig = signingConfigs.debug'
              new_release = 'signingConfig = signingConfigs.release'
          if 'keystoreProperties' not in s:
              assert 'android {' in s, 'android block not found'
              s = s.replace('android {', loader + 'android {', 1)
          if 'signingConfigs {' not in s:
              assert 'buildTypes {' in s, 'buildTypes block not found'
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          assert old_debug in s, 'debug signingConfig line not found'
          s = s.replace(old_debug, new_release)
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          assert new_release in s, 'release signingConfig not set'
          assert 'signingConfigs.debug' not in s and 'getByName("debug")' not in s, 'debug signing still present'
          open(p, 'w').write(s)
          print('Release signing configured in', p)
          PY
          grep -A 8 'signingConfigs' app/build.gradle.kts 2>/dev/null || grep -A 8 'signingConfigs' app/build.gradle

      - name: Install Android SDK 36
        run: |
          # Run #24 was blocked by Play: "must target at least API level 36".
          # Make sure the Android 16 (API 36) platform is installed on the
          # runner before building. Tolerant: already-installed is fine.
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" || echo "sdkmanager: platform 36 already installed or install skipped"
          else
            echo "sdkmanager not found at $SDKMGR, continuing with preinstalled SDKs"
          fi

      - name: Set applicationId, SDK levels and bump patch version
        run: |
          cd temp_app
          # PACKAGE NAME FIX (found 2026-11-27 while verifying run #22):
          # `flutter create --org com.mrshopworld.app --project-name
          # mr_shop_world` makes the applicationId
          # com.mrshopworld.app.mr_shop_world, but the Play app is
          # com.mrshopworld.app, so Play would refuse the AAB for a package
          # mismatch (run #21's minSdk error hid this). Force namespace and
          # applicationId to com.mrshopworld.app, and point the manifest's
          # MainActivity at its real fully-qualified class name, since the
          # Kotlin class stays in com.mrshopworld.app.mr_shop_world.
          python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else 'android/app/build.gradle'
          s = open(p).read()
          assert 'com.mrshopworld.app.mr_shop_world' in s, 'expected package string not in app/build.gradle(.kts)'
          s = s.replace('com.mrshopworld.app.mr_shop_world', 'com.mrshopworld.app')
          assert 'com.mrshopworld.app.mr_shop_world' not in s, 'wrong package still present in app/build.gradle'
          open(p, 'w').write(s)
          for line in s.splitlines():
              if 'namespace' in line or 'applicationId' in line:
                  print('package line now:', line.strip())
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          # The Flutter 3.24 template manifest has NO package attribute at
          # all (the namespace in build.gradle governs it), so the package
          # replace must be conditional — run #23 failed here on a strict
          # assert. Only the MainActivity fix is mandatory: with the
          # namespace now com.mrshopworld.app, a relative ".MainActivity"
          # would resolve to the wrong class.
          if 'package="com.mrshopworld.app.mr_shop_world"' in t:
              t = t.replace('package="com.mrshopworld.app.mr_shop_world"', 'package="com.mrshopworld.app"')
          # App label: the Setup step's sed handles it, but if the template
          # label differs, set it here as a fallback (no assert — a missing
          # label line must never fail the build).
          if 'android:label="mr_shop_world"' in t:
              t = t.replace('android:label="mr_shop_world"', 'android:label="MR Shop World"')
          if 'android:name=".MainActivity"' in t:
              t = t.replace('android:name=".MainActivity"', 'android:name="com.mrshopworld.app.mr_shop_world.MainActivity"')
          elif 'android:name="com.mrshopworld.app.mr_shop_world.MainActivity"' in t:
              pass
          else:
              raise AssertionError('MainActivity entry not found in AndroidManifest.xml')
          open(m, 'w').write(t)
          print('Manifest fixed: MainActivity fully qualified')
          # Play Console rejects AABs with minSdk below 24 ("Play automatic
          # protection requires a minimum SDK version of 24 or higher").
          # The Flutter 3.24 template sets minSdk from flutter.minSdkVersion
          # (= 21), so force it to 24 in app/build.gradle(.kts), whatever
          # form the template uses. Fail loudly if no minSdk line is found.
          p = 'android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else 'android/app/build.gradle'
          s = open(p).read()
          s2 = s
          s2 = re.sub(r'minSdkVersion\s*=\s*flutter\.minSdkVersion', 'minSdkVersion = 24', s2)
          s2 = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', s2)
          s2 = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', s2)
          s2 = re.sub(r'minSdk\s+flutter\.minSdkVersion', 'minSdk 24', s2)
          s2 = re.sub(r'minSdkVersion\s*=\s*21\b', 'minSdkVersion = 24', s2)
          s2 = re.sub(r'minSdk\s*=\s*21\b', 'minSdk = 24', s2)
          s2 = re.sub(r'minSdkVersion\s+21\b', 'minSdkVersion 24', s2)
          s2 = re.sub(r'minSdk\s+21\b', 'minSdk 24', s2)
          # TARGET SDK 36 (run #24 was blocked by Play: "must target at
          # least API level 36"). Flutter 3.24 defaults to targetSdk 34 and
          # compileSdk 34, so force both to 36 in app/build.gradle,
          # whatever form the template uses. compileSdk must be >= targetSdk.
          s2 = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', s2)
          s2 = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', s2)
          s2 = re.sub(r'compileSdk\s*=\s*34\b', 'compileSdk = 36', s2)
          s2 = re.sub(r'compileSdkVersion\s+34\b', 'compileSdkVersion 36', s2)
          s2 = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 36', s2)
          s2 = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 36', s2)
          s2 = re.sub(r'targetSdk\s*=\s*34\b', 'targetSdk = 36', s2)
          s2 = re.sub(r'targetSdkVersion\s+34\b', 'targetSdkVersion 36', s2)
          # BUILD TOOLS 36 (run #25 failed in :app:processReleaseResources):
          # Gradle used Build-Tools 30.0.3, whose aapt2 cannot read the
          # Android 36 platform jar ("Failed to load resources table in
          # android.jar"). Force build-tools 36.0.0 (installed by the
          # sdkmanager step). Set it inside the android block so it wins
          # over the Flutter plugin's default.
          if re.search(r'buildToolsVersion\s*=?\s*["\'][^"\']+["\']', s2):
              s2 = re.sub(r'buildToolsVersion\s*=?\s*["\'][^"\']+["\']', 'buildToolsVersion = "36.0.0"', s2)
          elif re.search(r'compileSdk\s*=\s*36[^\n]*\n', s2):
              s2 = re.sub(r'(compileSdk\s*=\s*36[^\n]*\n)', r'\1    buildToolsVersion = "36.0.0"\n', s2, count=1)
          elif re.search(r'compileSdkVersion\s+36[^\n]*\n', s2):
              s2 = re.sub(r'(compileSdkVersion\s+36[^\n]*\n)', r'\1    buildToolsVersion "36.0.0"\n', s2, count=1)
          assert 'buildToolsVersion = "36.0.0"' in s2 or 'buildToolsVersion "36.0.0"' in s2, 'buildToolsVersion 36 not set'
          assert s2 != s, 'No minSdk line found to change in app/build.gradle'
          assert 'flutter.minSdkVersion' not in s2, 'minSdk still comes from flutter.minSdkVersion'
          assert 'flutter.targetSdkVersion' not in s2, 'targetSdk still comes from flutter.targetSdkVersion'
          assert 'flutter.compileSdkVersion' not in s2, 'compileSdk still comes from flutter.compileSdkVersion'
          open(p, 'w').write(s2)
          for line in s2.splitlines():
              if 'minSdk' in line or 'targetSdk' in line or 'compileSdk' in line or 'buildToolsVersion' in line:
                  print('SDK line now:', line.strip())
          # Bump the patch version so Play does not reuse the version code of
          # an earlier refused/draft bundle (run #21 was refused at upload;
          # run #24 reached a draft as versionCode 2 and will be discarded).
          # Only bumps when the version is still 1.0.0+1; later repo bumps
          # are left alone.
          q = 'pubspec.yaml'
          t = open(q).read()
          if 'version: 1.0.0+1' in t:
              t = t.replace('version: 1.0.0+1', 'version: 1.0.2+3')
              open(q, 'w').write(t)
              print('Version bumped to 1.0.2+3')
          for line in t.splitlines():
              if line.startswith('version:'):
                  print('pubspec version now:', line.strip())
          PY

      - name: Generate Icons & Build Play Store AAB + APK
        run: |
          cd temp_app
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify AAB is release-signed
        run: |
          cd temp_app
          AAB=build/app/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          # The signature file name comes from the key alias, uppercased and
          # truncated to 8 chars: debug key alias "androiddebugkey" gives
          # META-INF/ANDROIDD.RSA, but our upload key alias "mrshopworld"
          # gives META-INF/MRSHOPWO.RSA. Never hardcode the name; find it.
          SIG=$(unzip -l "$AAB" | grep -oE 'META-INF/[A-Z0-9_]+\.(RSA|DSA|EC)' | head -n 1)
          echo "Signature file in AAB: $SIG"
          test -n "$SIG" || (echo "ERROR: No signing certificate in AAB!" && exit 1)
          unzip -p "$AAB" "$SIG" > /tmp/bundle.sig
          openssl pkcs7 -inform DER -in /tmp/bundle.sig -print_certs -out /tmp/bundle.pem
          openssl x509 -in /tmp/bundle.pem -noout -subject -fingerprint -sha256
          openssl x509 -in /tmp/bundle.pem -noout -subject | grep -q "MR Shop World" || (echo "ERROR: AAB is NOT signed with the MR Shop World upload key!" && exit 1)
          echo "AAB is correctly signed with the MR Shop World upload key."

      - name: Upload Play Store AAB, APK & Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: MR-Shop-World-PlayStore-Release
          path: |
            temp_app/build/app/outputs/bundle/release/app-release.aab
            temp_app/build/app/outputs/flutter-apk/app-release.apk
            temp_app/android/app/upload-keystore.jks

  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
      - name: Setup iOS Project & Logo
        run: |
          mkdir temp_app
          cd temp_app
          flutter create . --project-name mr_shop_world --org com.mrshopworld.app
          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart
          cp ../logo.jpg logo.jpg
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MR Shop World" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MR Shop World" ios/Runner/Info.plist
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r -y MR-Shop-World-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MR-Shop-World-iOS
          path: temp_app/MR-Shop-World-iOS.ipa
          
